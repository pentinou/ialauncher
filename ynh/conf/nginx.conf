location __PATH__/ {
  proxy_pass __UPSTREAM__;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # ceinture et bretelles : aucun identifiant ne part vers le launcher (HTTP en clair sur le réseau local)
  proxy_set_header Authorization "";
  proxy_read_timeout 3600;
  proxy_connect_timeout 4s;
  # images d'entrée (img2img) envoyées avec la demande de génération
  client_max_body_size 50m;

  # serveur de calcul éteint ou launcher arrêté : une page claire, avec un bouton de réveil
  proxy_intercept_errors on;
  error_page 502 503 504 /__APP__-eteint.html;
}

location = /__APP__-eteint.html {
  alias __INSTALL_DIR__/pc_eteint.html;
  internal;
}

# Réveil du serveur de calcul (Wake-on-LAN), derrière le SSO comme le reste de la tuile
location = __PATH_REVEIL__ {
  proxy_pass http://127.0.0.1:__PORT__/;
}
