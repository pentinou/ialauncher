#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "ialauncher"
name = "IA Launcher"
description.fr = "Tuile du portail vers IA Launcher, sur cette machine ou sur un serveur de calcul du réseau (derrière le SSO, sans transmettre d'identifiants)"
description.en = "Portal tile to IA Launcher, on this machine or on a compute server of the network (behind SSO, no credentials forwarded)"

version = "1.0~ynh1"
maintainers = ["pentinou"]

[upstream]
license = "MIT"
code = "https://github.com/pentinou/ialauncher"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "1M"
ram.build = "10M"
ram.runtime = "1M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.upstream]
    ask.fr = "Adresse du launcher : http://127.0.0.1:8765 s'il tourne sur ce serveur, sinon http://ADRESSE_DU_SERVEUR_DE_CALCUL:8765"
    ask.en = "Launcher address: http://127.0.0.1:8765 on this server, else http://COMPUTE_SERVER_ADDRESS:8765"
    type = "string"
    default = "http://127.0.0.1:8765"
    example = "http://192.168.1.50:8765"

    [install.label]
    ask.fr = "Nom de la tuile dans le portail"
    ask.en = "Tile name in the portal"
    type = "string"
    default = "IA Launcher"

    [install.mac]
    ask.fr = "Adresse MAC du serveur de calcul, pour un bouton « Réveiller le PC » quand il est éteint (vide = pas de bouton)"
    ask.en = "MAC address of the compute server, for a \"Wake up\" button when it is off (empty = no button)"
    type = "string"
    optional = true
    example = "AA:BB:CC:DD:EE:FF"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]

    [resources.install_dir]
    # nginx (www-data) sert la page « serveur éteint » depuis ce dossier
    group = "www-data:r-x"

    [resources.ports]
    main.default = 8099

    [resources.permissions]
    main.url = "/"
    # le SSO ne transmet PAS d'en-tête Authorization (identifiants) au serveur de calcul
    main.auth_header = false
